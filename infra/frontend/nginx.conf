server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback para rotas profundas (/projects/1, /library, /settings…)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # assets com cache agressivo (nome com hash do Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}