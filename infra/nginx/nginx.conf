server {
    listen 80;
    server_name _;

    # Aplicação SPA servida pelo contêiner frontend (build multi-stage, §12)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API REST do backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth endpoints
    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Mídia servida pelo backend (downloads autorizados)
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # SSE de progresso — Cache-Control: no-cache + buffering desligado (AGENTS.md §12)
    location /stream/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Accel-Buffering no;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header Cache-Control "no-cache";
        chunked_transfer_encoding off;
    }

    # Healthcheck do backend
    location /api/v1/health {
        proxy_pass http://backend:8000;
    }
}